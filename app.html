<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11121a"><link rel="manifest" href="/manifest.json"><title>NEXUS ONE</title><link rel="stylesheet" href="/styles.css"></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null, projects=[], missions=[], current='home', billing=null;
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{} if(!r.ok)throw Object.assign(new Error(d.error||'Erro na API'),{status:r.status,data:d});return d}
function toast(x){const t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function shell(){return `<div class="shell"><aside><div class="brand">NEXUS<span>ONE</span></div><div class="user">${esc(me.name)}<small>${esc(me.email)}</small></div><nav>${[['home','⌂','Início'],['missions','⚡','Missões'],['projects','▣','Projetos'],['memory','◌','Memória'],['billing','◫','Plano'],['affiliate','🤝','Afiliados'],['owner','♛','Owner']].map(x=>`<button class="${current===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}</nav><button class="logout" onclick="logout()">Sair</button></aside><main><header><div><small>NEXUS ONE</small><h2 id="title"></h2></div><div class="status"><span></span> ONLINE</div></header><div id="view"></div></main></div>`}
function go(x){current=x;render()}
async function load(){const [p,m,b]=await Promise.all([api('/api/projects'),api('/api/missions'),api('/api/billing/me')]);projects=p.projects;missions=m.missions;billing=b;render()}
async function render(){if(!me){return authView()} document.body.innerHTML=shell();const titles={home:'Centro de comando',missions:'Missões',projects:'Projetos',memory:'Memória',billing:'Plano e créditos',affiliate:'Programa de afiliados',owner:'Owner Console'};$('#title').textContent=titles[current]; if(current==='home')home();if(current==='missions')missionView();if(current==='projects')projectView();if(current==='memory')memoryView();if(current==='billing')billingView();if(current==='affiliate')affiliateView();if(current==='owner')ownerView()}
function home(){const completed=missions.filter(m=>m.status==='COMPLETED').length;$('#view').innerHTML=`<section class="hero card"><div class="eyebrow">NEXUS CORE</div><h1>Diga o que você precisa.<br><em>O NEXUS transforma em execução.</em></h1><p>Descreva um objetivo. O NEXUS organiza o contexto, cria um plano e executa a missão.</p><textarea id="objective" placeholder="Ex.: Quero criar uma estratégia para aumentar as vendas do meu negócio no Instagram."></textarea><div class="bar"><select id="project">${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn" onclick="runMission()">EXECUTAR MISSÃO →</button></div></section><section class="grid"><div class="card stat"><small>MISSÕES</small><strong>${missions.length}</strong></div><div class="card stat"><small>CONCLUÍDAS</small><strong>${completed}</strong></div><div class="card stat"><small>CRÉDITOS</small><strong>${billing?.credit_balance??'—'}</strong></div></section>${missions[0]?`<section class="card"><div class="row"><h3>Última missão</h3><span class="pill">${esc(missions[0].status)}</span></div><p>${esc(missions[0].objective)}</p><button class="btn secondary" onclick="openMission('${missions[0].id}')">Ver execução</button></section>`:''}`}
async function runMission(){const objective=$('#objective').value.trim(),projectId=$('#project').value;if(!objective)return toast('Descreva o objetivo.');try{const d=await api('/api/missions',{method:'POST',body:JSON.stringify({objective,projectId})});toast('Missão criada. Executando…');await waitJob(d.job.id,d.mission.id)}catch(e){toast(e.message)} }
async function waitJob(jobId,missionId){for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,700));try{const j=await api('/api/jobs/'+jobId);if(j.job.status==='COMPLETED'||j.job.status==='FAILED'){await load();go('missions');if(j.job.status==='COMPLETED')toast('Missão concluída.');else toast('A missão falhou; veja os detalhes.');return}}catch(e){return toast(e.message)}}toast('A execução demorou mais que o esperado.');await load()}
async function openMission(id){try{const d=await api('/api/missions/'+id);const m=d.mission;document.body.innerHTML=shell();$('#title').textContent='Execução';$('#view').innerHTML=`<section class="card"><div class="eyebrow">${esc(m.classification||'GENERAL')}</div><h2>${esc(m.objective)}</h2><div class="result">${esc(m.result||'A missão ainda está sendo processada.')}</div><h3>Tarefas</h3>${d.tasks.map(t=>`<div class="task"><b>${esc(t.title||t.name||'Tarefa')}</b><small>${esc(t.status||'')}</small></div>`).join('')}</section>`}catch(e){toast(e.message)}}
function missionView(){$('#view').innerHTML=`<section class="card"><div class="row"><h3>Histórico</h3><span class="pill">${missions.length}</span></div>${missions.length?missions.map(m=>`<div class="task" onclick="openMission('${m.id}')"><div class="dot">${m.status==='COMPLETED'?'✓':'•'}</div><div><b>${esc(m.objective)}</b><small>${esc(m.status)} · ${new Date(m.created_at).toLocaleString('pt-BR')}</small></div></div>`).join(''):'<p class="muted">Nenhuma missão ainda.</p>'}</section>`}
function projectView(){$('#view').innerHTML=`<section class="card"><div class="row"><h3>Projetos</h3><button class="btn" onclick="addProject()">+ Novo projeto</button></div>${projects.map(p=>`<div class="task"><div class="dot">⌂</div><div><b>${esc(p.name)}</b><small>${esc(p.description||'Workspace')}</small></div></div>`).join('')}</section>`}
async function addProject(){const name=prompt('Nome do projeto:');if(!name)return;try{await api('/api/projects',{method:'POST',body:JSON.stringify({name})});await load();toast('Projeto criado.')}catch(e){toast(e.message)}}
async function memoryView(){let html='';for(const p of projects){try{const d=await api('/api/projects/'+p.id+'/memories');html+=d.memories.map(x=>`<div class="task"><div>◌</div><div><b>${esc(x.content)}</b><small>${new Date(x.created_at).toLocaleString('pt-BR')}</small></div></div>`).join('')}catch{}}$('#view').innerHTML=`<section class="card"><h3>Memória contextual</h3><p class="muted">Contexto persistido por projeto.</p>${html||'<p class="muted">Ainda não há memórias registradas.</p>'}</section>`}
async function billingView(){const d=await api('/api/billing/plans');$('#view').innerHTML=`<section class="card"><h3>Seu plano</h3><p>Saldo: <b>${billing.credit_balance} créditos</b></p><div class="grid">${d.plans.map(p=>`<div class="card"><h3>${esc(p.name||p.code)}</h3><p>${p.credits} créditos/mês</p><p><b>${p.price?('R$ '+Number(p.price).toFixed(2)):'Grátis'}</b></p>${p.code==='FREE'?'<button class="btn secondary" disabled>Plano atual</button>':`<button class="btn" onclick="checkout('${p.code}')">Escolher plano</button>`}</div>`).join('')}</div><p class="muted">Ambiente: ${esc(billing.billing_mode)}. Em produção, o checkout precisa estar conectado ao gateway real.</p></section>`}
async function checkout(plan){try{const d=await api('/api/billing/checkout',{method:'POST',body:JSON.stringify({plan})});if(confirm('Checkout criado. Concluir demonstração agora?')){await api('/api/billing/checkout/'+d.checkout.id+'/complete',{method:'POST'});await load();toast('Plano ativado.')}}catch(e){toast(e.message)}}
function affiliateView(){$('#view').innerHTML=`<section class="card"><h3>Programa de afiliados</h3><p>Infraestrutura preparada. O rastreamento e payouts serão ativados na etapa comercial.</p><div class="grid"><div class="card stat"><small>STATUS</small><strong>PREPARAÇÃO</strong></div><div class="card stat"><small>COMISSÃO</small><strong>—</strong></div></div></section>`}
async function ownerView(){try{const d=await api('/api/owner/overview');const m=d.metrics;$('#view').innerHTML=`<section class="grid"><div class="card stat"><small>USUÁRIOS</small><strong>${m.users}</strong></div><div class="card stat"><small>CLIENTES PAGANTES</small><strong>${m.paid_customers}</strong></div><div class="card stat"><small>MRR</small><strong>R$ ${m.mrr.toFixed(2)}</strong></div><div class="card stat"><small>CUSTO IA</small><strong>R$ ${m.ai_cost.toFixed(2)}</strong></div></section><section class="card"><h3>Operação</h3><table class="table"><tr><td>Missões</td><td>${m.missions}</td></tr><tr><td>Concluídas</td><td>${m.completed_missions}</td></tr><tr><td>Taxa de sucesso</td><td>${m.mission_success_rate==null?'—':(m.mission_success_rate*100).toFixed(1)+'%'}</td></tr><tr><td>Partners aprovados</td><td>${m.approved_partners}</td></tr><tr><td>Receita paga</td><td>R$ ${m.paid_revenue.toFixed(2)}</td></tr></table>${d.alerts.length?'<div class="alerts">'+d.alerts.map(a=>`<p><b>${esc(a.severity)}</b> ${esc(a.message)}</p>`).join('')+'</div>':'<p class="muted">Nenhum alerta crítico.</p>'}</section>`}catch(e){$('#view').innerHTML=`<section class="card"><h3>Owner</h3><p>${esc(e.message)}</p><p class="muted">Acesso restrito ao Platform Owner.</p></section>`}}
function authView(){document.body.innerHTML=`<div class="auth"><div class="authbox"><div class="brand">NEXUS<span>ONE</span></div><h1>Seu sistema operacional de execução.</h1><p class="muted">Entre ou crie sua conta para começar.</p><div class="tabs"><button id="loginTab" class="active" onclick="authMode('login')">Entrar</button><button id="signupTab" onclick="authMode('signup')">Criar conta</button></div><div id="authForm"></div></div></div>`;authMode('login')}
function authMode(mode){$('#loginTab').classList.toggle('active',mode==='login');$('#signupTab').classList.toggle('active',mode==='signup');$('#authForm').innerHTML=mode==='login'?`<input id="email" placeholder="E-mail" type="email"><input id="password" placeholder="Senha" type="password"><button class="btn wide" onclick="login()">ENTRAR</button>`:`<input id="name" placeholder="Nome"><input id="email" placeholder="E-mail" type="email"><input id="password" placeholder="Senha (mín. 8 caracteres)" type="password"><button class="btn wide" onclick="signup()">CRIAR CONTA</button>`}
async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});me=d.user;await load()}catch(e){toast(e.message)}}
async function signup(){try{const d=await api('/api/auth/signup',{method:'POST',body:JSON.stringify({name:$('#name').value,email:$('#email').value,password:$('#password').value})});me=d.user;await load()}catch(e){toast(e.message)}}
async function logout(){await api('/api/auth/logout',{method:'POST'});me=null;render()}
(async()=>{try{const d=await api('/api/auth/me');me=d.user;await load();}catch{authView();}})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script></body></html>
